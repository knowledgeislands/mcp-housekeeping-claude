# Knowledge Islands repository configuration.
# Its presence declares conformance with the Knowledge Islands repository standard.

# =============================================================================

# -----------------------------------------------------------------------------
# Foundation
# -----------------------------------------------------------------------------

[repo]
harnesses = ["knowledgeislands/ki-agentic-harness"]

[skills.ki-repo]
repository = "https://github.com/knowledgeislands/mcp-housekeeping-claude"
title = "mcp-housekeeping-claude"
description = "MCP for auditing and pruning Claude Desktop, Claude Code, and VS Code session state on local filesystems."
repo_code = "MCP-CH"
supported_runtimes = ["claude-code", "claude-desktop", "chatgpt-codex"]
visibility = "public"

[skills.ki-authoring]
[skills.ki-binding]
[skills.ki-binding-claude]
[skills.ki-binding-chatgpt]
[skills.ki-housekeeping-chatgpt]
auto_memory = "disabled"

[skills.ki-guides]

# -----------------------------------------------------------------------------
# Repository shape
# -----------------------------------------------------------------------------

[skills.ki-repo-project]

[skills.ki-repo-mcp]

# -----------------------------------------------------------------------------
# Governance and runtime
# -----------------------------------------------------------------------------

[skills.ki-engineering]

[skills.ki-decision-records]

# -----------------------------------------------------------------------------
# Change management
# -----------------------------------------------------------------------------

[skills.ki-agent-coordination-paperclip]
organisation_code = "KIS"

[skills.ki-git]

[skills.ki-work]
adapter = "roadmap"

[skills.ki-work-roadmap]
themes = ["foundation-tooling", "operations"]
areas.FND = "foundation-tooling"
areas.OPS = "operations"

[skills.ki-housekeeping-claude]
auto_memory = "disabled"

[skills.ki-tokenomics]

[skills.ki-tokenomics-claude]

[skills.ki-tokenomics-chatgpt]

# -----------------------------------------------------------------------------
# Relationships
# -----------------------------------------------------------------------------

[skills.ki-trades]

[skills.ki-trades.routes."knowledgeislands/ki-agentic-harness"]
export = ["work", "knowledge"]
import = ["knowledge"]

[skills.ki-trades.routes."knowledgeislands/ki-agentic-harness".standing.export]
knowledge = ["shared-capability-maintenance"]

[skills.ki-agora]
memberships.kis = { home = "https://github.com/knowledgeislands/ki-arcadia-principal", role = "product" }
